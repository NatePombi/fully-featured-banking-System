name: Java CI with Maven + Jacoco + Codecov

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: bankingTest
          MYSQL_ROOT_PASSWORD: MasokoBums
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_TEST_URL: jdbc:mysql://127.0.0.1:3306/bankingTest
      DB_USERNAME: root
      DB_PASSWORD: MasokoBums

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Wait for MySQL to be ready
        run: |
          for i in {30..0}; do
            if mysqladmin ping -h127.0.0.1 -uroot -pMasokoBums --silent; then
              echo "MySQL is up"
              break
            fi
            echo 'Waiting for MySQL...'
            sleep 1
          done

      - name: Build and run tests with coverage
        run: mvn -B clean verify

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
